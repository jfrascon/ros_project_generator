# To use:
#
#     pre-commit run -a
#
# Or:
#
#     pre-commit install  # (runs every time you commit in git)
#
# To update this file:
#
#     pre-commit autoupdate
#
# See https://github.com/pre-commit/pre-commit

default_install_hook_types:
  - pre-commit
  - commit-msg

exclude: ^build/|^install/|^log/|^\.vscode/|^src/0_deps/

repos:
  # Standard hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        # 25600 KiB = 25 MiB; ROS projects may need to version reasonably sized mesh/assets files.
        args: [--maxkb=25600]
      - id: check-ast
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-yaml
        exclude: (^|/)\.clang-format$
      - id: check-json
      - id: check-xml
      - id: check-toml
      - id: debug-statements
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude_types: [svg]
      - id: mixed-line-ending
        # Use one deterministic line ending instead of preserving each file's majority style.
        args: [--fix=lf]
      - id: trailing-whitespace
        exclude_types: [svg]
      - id: fix-byte-order-marker
      - id: no-commit-to-branch
        args:
          - --branch=main
          - --branch=master

  # Python hooks
  # Ruff replaces both Black (formatter) and isort (import sorting).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # ROS 2 Python validation
  # These hooks validate Python after Ruff applies its automatic changes.
  - repo: local
    hooks:
      - id: ament_flake8
        name: ament_flake8
        description: Check Python code with the ROS 2 Flake8 configuration.
        entry: ament_flake8
        language: system
        types: [python]
        args: [--config=ament_flake8.ini]

      - id: ament_pep257
        name: ament_pep257
        description: Check Python docstrings with the ROS 2 PEP 257 configuration.
        entry: ament_pep257
        language: system
        types: [python]

      # - id: ament_mypy
      #   name: ament_mypy
      #   description: Statically check Python type annotations with mypy.
      #   entry: ament_mypy
      #   language: system
      #   types: [python]

  # TOML hooks
  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format
      - id: taplo-lint
        args: [--no-schema]

  # YAML hooks
  - repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
    rev: v2.16.0
    hooks:
      # Keep sequence markers indented under their parent key. This is easier to
      # scan than the valid but visually flat YAML produced with offset zero.
      - id: pretty-format-yaml
        args: [--autofix, --preserve-quotes, --offset, "2"]

  # CPP hooks
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.0
    hooks:
      - id: clang-format
        # .c: C.
        # .cc/.cpp/.cxx: C++.
        # .h: C or C++ headers.
        # .hh/.hpp/.hxx: C++ headers.
        # .ipp: inline implementation files commonly included from headers.
        # .tpp: template implementation files included by templated headers.
        files: '\.(c|cc|cpp|cxx|h|hh|hpp|hxx|ipp|tpp)$'
        args: ["-fallback-style=none", "-i"]

  # ROS/ament hooks
  # These hooks use language: system and require the corresponding ament tools
  # to be installed in the development environment.
  - repo: local
    hooks:
      - id: ament_cpplint
        name: ament_cpplint
        description: Check C/C++ style with ROS 2 cpplint.
        entry: ament_cpplint
        language: system
        files: '\.(h\+\+|h|hh|hxx|hpp|cuh|c|cc|cpp|cu|c\+\+|cxx|tpp|txx)$'
        args:
          - --linelength=120
          # Keep cpplint aligned with .clang-format:
          # Disable whitespace/newline: .clang-format controls brace placement.
          # Disable whitespace/forcolon: .clang-format omits the space before range-for ':'.
          # Disable build/include_order: .clang-format preserves include order.
          # Disable runtime/indentation_namespace: .clang-format controls namespace indentation.
          # Disable legal/copyright: this project does not enforce copyright headers.
          - --filters=-whitespace/newline,-whitespace/forcolon,-build/include_order,-runtime/indentation_namespace,-legal/copyright

      - id: ament_cppcheck
        name: ament_cppcheck
        description: Static code analysis of C/C++ files.
        entry: env AMENT_CPPCHECK_ALLOW_SLOW_VERSIONS=1 ament_cppcheck
        language: system
        files: '\.(h\+\+|h|hh|hxx|hpp|cuh|c|cc|cpp|cu|c\+\+|cxx|tpp|txx)$'
        # Test sources are compiled, checked by the other C++ hooks, and run separately.
        exclude: (^|/)test/

      - id: ament_lint_cmake
        name: ament_lint_cmake
        description: Check format of CMakeLists.txt files.
        entry: ament_lint_cmake
        language: system
        files: CMakeLists\.txt$

      - id: ament_xmllint
        name: ament_xmllint
        description: Check XML files with the ROS 2 XML linter.
        entry: ament_xmllint
        language: system
        types: [xml]

      # Keep this hook as a reference for projects with a strict copyright policy.
      # - id: ament_copyright
      #   name: ament_copyright
      #   description: Check if copyright notice is available in all files.
      #   entry: ament_copyright
      #   language: system
      #   exclude: .*/conf\.py$

  # Shell hooks
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
        args: [-w, -s, -i=4]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      # ShellCheck may report many warnings in legacy scripts, but it catches real bugs.
      # Prefer justified local suppressions over disabling the hook; for example,
      # '# shellcheck disable=SC1091' before sourcing a file that only exists at runtime.
      - id: shellcheck

  # Secrets scanning
  # Gitleaks detects tokens, passwords, PATs, API keys, and other secrets beyond private keys.
  # Keep this documented for future use; uncomment when broader secret scanning is desired.
  # - repo: https://github.com/gitleaks/gitleaks
  #   rev: v8.24.2
  #   hooks:
  #     - id: gitleaks

  # Conventional Commits validation (commit message hook)
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - --verbose
          - build
          - chore
          - ci
          - docs
          - feat
          - fix
          - perf
          - refactor
          - revert
          - style
          - test
